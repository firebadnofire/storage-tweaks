name: Validate implemented targets
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  forge-1122:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 8.0.472+8
      - name: Test and build Forge 1.12.2
        run: bash gradlew --no-daemon :common:test :forge-1.12.2:build
      - name: Hash distribution artifacts
        run: |
          cd forge-1.12.2/build/libs
          sha256sum *-mc1.12.2-forge.jar *-sources.jar > SHA256SUMS
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: storage-tweaks-forge-1.12.2
          path: |
            forge-1.12.2/build/libs/*-mc1.12.2-forge.jar
            forge-1.12.2/build/libs/*-sources.jar
            forge-1.12.2/build/libs/SHA256SUMS
            common/build/test-results/test/*.xml
            forge-1.12.2/build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 14
