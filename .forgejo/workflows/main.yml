name: Storage Tweaks build, smoke test and signed releases
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    timeout-minutes: 45
    steps:
      - name: Install build utilities
        run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends git python3 gnupg ca-certificates
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '8.0.472+8'
      - name: Validate CI helpers
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Build, test, reobfuscate and inspect
        run: bash scripts/ci/build.sh
      - name: Validate signing with a disposable key
        run: python3 scripts/ci/signing_preflight.py
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: distributable
          path: ci-dist/
          if-no-files-found: error
      - name: Retain build evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: build-evidence
          path: |
            gradle-build.log
            gradle-version.log
            common/build/test-results/test/
            forge-1.12.2/build/test-results/test/
          if-no-files-found: warn

  minecraft-smoke:
    needs: build
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    timeout-minutes: 25
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends git python3 ca-certificates
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '8.0.472+8'
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: distributable
          path: ci-dist
      - name: Test the exact built JAR on Forge 2864
        run: python3 scripts/ci/smoke.py ci-dist smoke-result
      - name: Retain Minecraft evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: minecraft-evidence
          path: smoke-result/
          if-no-files-found: error

  release:
    needs: [build, minecraft-smoke]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    timeout-minutes: 20
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends git python3 gnupg ca-certificates
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: distributable
          path: ci-dist
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: minecraft-evidence
          path: smoke-result
      - name: Verify the successful exact-JAR smoke result
        run: python3 -c "import json; assert json.load(open('smoke-result/result.json'))['passed']"
      - name: Sign and verify selected artifacts
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: bash scripts/ci/sign.sh
      - name: Publish a verified Forgejo release
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
          RELEASE_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish.sh
